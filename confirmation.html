
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation | CineBook</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ticket {
            max-width: 520px;
            margin: 45px auto;
            padding: 28px;
            background: #171820;
            border: 1px solid #343541;
            border-radius: 15px;
        }
        .success { color: #31bd83; }
        .ticket-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #343541;
        }
        .ticket-row span:first-child { color: #b7b8c2; }
        .ticket-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }
        .ticket-actions a, .ticket-actions button {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        .home-btn { background: #ffbd59; color: #17120a; }
        .print-btn { background: #343541; color: white; }
        .note { color: #a6a7b2; font-size: 13px; margin-top: 20px; }
        @media print {
            body { background: white; color: black; }
            .navbar, .ticket-actions, .note { display: none; }
            .ticket { border: 1px solid #777; background: white; }
            .ticket-row span:first-child { color: #444; }
        }
    </style>
</head>
<body>
<header class="navbar">
    <a href="index.html" class="logo">Cine<span>Book</span></a>
</header>

<main class="ticket">
    <p class="tagline">CINEBOOK DIGITAL TICKET</p>
    <h1 class="success">✓ Booking Summary</h1>
    <p id="bookingId" style="margin-top:8px"></p>

    <div id="ticketDetails" style="margin-top:20px"></div>

    <div class="ticket-actions">
        <a class="home-btn" href="index.html">Home</a>
        <button class="print-btn" onclick="window.print()">Print</button>
    </div>

    <p class="note">
        Academic demo only. This summary is not a valid cinema ticket.
        No payment has been processed and seats are not reserved in a live system.
    </p>
</main>

<script>
const booking = JSON.parse(
    sessionStorage.getItem("cinebookBooking") || "null"
);

if (!booking || !booking.seats || booking.seats.length !== booking.quantity) {
    alert("No complete booking found. Please start again.");
    window.location.href = "index.html";
} else {
    // Demonstration reference only; not a database booking ID.
    const reference = "DEMO-" + Date.now().toString().slice(-8);
    document.getElementById("bookingId").textContent =
        "Demo Reference: " + reference;

    const details = [
        ["Movie", booking.movie],
        ["Date", booking.date],
        ["Showtime", booking.time],
        ["Tickets", booking.quantity],
        ["Seats", booking.seats.join(", ")],
        ["Price per ticket", "₹" + booking.price],
        ["Total Amount", "₹" + booking.total]
    ];

    const container = document.getElementById("ticketDetails");

    details.forEach(function(item) {
        const row = document.createElement("div");
        row.className = "ticket-row";

        const label = document.createElement("span");
        label.textContent = item[0];

        const value = document.createElement("strong");
        value.textContent = item[1];

        row.append(label, value);
        container.appendChild(row);
    });
}
</script>
</body>
</html>
