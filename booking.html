
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets | CineBook</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .booking-box {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background: #171820;
            border: 1px solid #343541;
            border-radius: 12px;
        }
        .booking-box h1 { margin-bottom: 20px; }
        .booking-box label {
            display: block;
            margin: 15px 0 6px;
        }
        .booking-box input, .booking-box select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #22232d;
            color: white;
        }
        .booking-box button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #ffbd59;
            font-weight: bold;
            cursor: pointer;
        }
        .price { color: #ffbd59; }
        .back-link { display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
<header class="navbar">
    <a href="index.html" class="logo">Cine<span>Book</span></a>
    <a href="index.html">← Back to Movies</a>
</header>

<main class="booking-box">
    <p class="tagline">STEP 1 — BOOK YOUR SHOW</p>
    <h1>Movie Booking</h1>

    <form id="bookingForm">
        <label for="movie">Selected Movie</label>
        <input id="movie" name="movie" readonly>

        <label for="price">Price per Ticket (₹)</label>
        <input id="price" name="price" type="number" readonly>

        <label for="date">Select Date</label>
        <input id="date" name="date" type="date" required>

        <label for="time">Select Showtime</label>
        <select id="time" name="time" required>
            <option value="">Choose a showtime</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="1:30 PM">1:30 PM</option>
            <option value="5:00 PM">5:00 PM</option>
            <option value="8:30 PM">8:30 PM</option>
        </select>

        <label for="quantity">Number of Tickets</label>
        <select id="quantity" name="quantity" required>
            <option value="1">1 Ticket</option>
            <option value="2">2 Tickets</option>
            <option value="3">3 Tickets</option>
            <option value="4">4 Tickets</option>
            <option value="5">5 Tickets</option>
            <option value="6">6 Tickets</option>
        </select>

        <h3 style="margin-top:20px">
            Total: <span class="price" id="total">₹0</span>
        </h3>

        <button type="submit">Continue to Seat Selection →</button>
    </form>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const movieName = params.get("movie") || "";
const ticketPrice = Number(params.get("price")) || 0;

document.getElementById("movie").value = movieName;
document.getElementById("price").value = ticketPrice;

const dateInput = document.getElementById("date");
const today = new Date();
const localToday = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")
].join("-");

dateInput.min = localToday;
dateInput.value = localToday;

function updateTotal() {
    const qty = Number(document.getElementById("quantity").value);
    document.getElementById("total").textContent =
        "₹" + (ticketPrice * qty);
}

document.getElementById("quantity").addEventListener("change", updateTotal);
updateTotal();

document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (!movieName || ticketPrice <= 0) {
        alert("Please select a movie from the homepage.");
        return;
    }

    const date = dateInput.value;
    if (!date || date < localToday) {
        alert("Please select today or a future date.");
        return;
    }

    const booking = {
        movie: movieName,
        price: ticketPrice,
        date: date,
        time: document.getElementById("time").value,
        quantity: Number(document.getElementById("quantity").value)
    };

    sessionStorage.setItem("cinebookBooking", JSON.stringify(booking));
    window.location.href = "seats.html";
});
</script>
</body>
</html>
